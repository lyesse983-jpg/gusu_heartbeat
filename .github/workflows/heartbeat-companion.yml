name: Heartbeat Companion checks

on:
  push:
    paths:
      - 'heartbeat-companion/**'
      - '.github/workflows/heartbeat-companion.yml'
  pull_request:
    paths:
      - 'heartbeat-companion/**'
      - '.github/workflows/heartbeat-companion.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heartbeat-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: heartbeat-companion/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q companion tests
      - run: node --check companion/static/app.js
